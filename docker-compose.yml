services:
  sovereign-prompt:
    build: ./sovereign-prompt
    ports:
      - "8790:8790"
      - "8787:8787"
    environment:
      - DATABASE_URL=postgres://sovereign:sovereign@postgres:5432/sovereign_prompt
      - SOVEREIGN_MCP_TRANSPORT=sse
      - SOVEREIGN_MCP_SSE_ADDR=0.0.0.0:8790
      - SOVEREIGN_DASHBOARD_ADDR=0.0.0.0:8787
      - SOVEREIGN_HMAC_KEY=${SOVEREIGN_HMAC_KEY:-sovereign-prompt-dev-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sovereign
      POSTGRES_PASSWORD: sovereign
      POSTGRES_DB: sovereign_prompt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovereign"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
