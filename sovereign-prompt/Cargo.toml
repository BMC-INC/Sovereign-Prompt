[package]
name = "sovereign-prompt"
version = "0.1.0"
edition = "2021"
authors = ["ExecLayer Inc."]
description = "SovereignPrompt — Real-time MCP prompt optimization with persistence and token analysis"
license = "MIT"

[[bin]]
name = "sovereign-prompt"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.1", features = ["server", "transport-io", "transport-sse-server"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
tiktoken-rs = "0.5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
dotenvy = "0.15"
axum = { version = "0.7", features = ["ws"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
